<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Dashboard</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(to right, #ffe0c3, #f5f5f5);
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 60px;
		}

		h2 {
			font-size: 32px;
			color: #2c3e50;
			margin-bottom: 40px;
		}

		.dashboard-links {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		.dashboard-links a {
			text-decoration: none;
			padding: 12px 24px;
			background-color: #3498db;
			color: white;
			border-radius: 8px;
			text-align: center;
			font-size: 18px;
			width: 220px;
			transition: background-color 0.3s ease;
		}

		.dashboard-links a:hover {
			background-color: #2980b9;
		}
	</style>
</head>

<body>

	<h2>Welcome to Student Dashboard</h2>

	<div class="dashboard-links">
		<a href="add.html">➕ Add Student</a>
		<a href="view.html">📄 View All Students</a>
		<a href="update.html">✏️ Update Student</a>
		<a href="delete.html">❌ Delete Student</a>
	</div>

</body>

</html>
